image: 'atlassian/default-image:3'
pipelines:
  # The pr-agent review on pull requests is TEMPORARILY DISABLED (2026-09-01).
  #
  # Two reasons, either of which is sufficient on its own. `pragent/pr-agent:latest`
  # stopped shipping a `pr-agent` binary on PATH, so every run failed and every PR
  # merged unreviewed anyway; and while it did work, the review regularly took long
  # enough to hold up landings.
  #
  # To re-enable, uncomment the block below -- and fix it in the same change: pin a
  # known-good image tag instead of `:latest`, or point the script at whatever
  # entrypoint the current image actually provides.
  #
  # The merge-to-develop skill decides whether to wait for a review by reading THIS
  # FILE (`.claude/skills/merge-to-develop/scripts/bb-repo.sh review-enabled`): an
  # uncommented line mentioning `pr-agent` is what turns waiting back on. So
  # re-enabling here needs no matching change on the skill side, and disabling it
  # again needs none either -- keep the two in sync by keeping this the only switch.
  #
  # pull-requests:
  #   '**':
  #     - step:
  #         name: PR Agent Improve
  #         image: pragent/pr-agent:latest
  #         clone:
  #           depth: 1
  #         script:
  #           - pr-agent --pr_url="https://bitbucket.org/$BITBUCKET_WORKSPACE/$BITBUCKET_REPO_SLUG/pull-requests/$BITBUCKET_PR_ID" improve
  custom:
    push-to-github-repo:
      - variables:
          - name: TargetBranch
            default: beta
            allowed-values:
              - master
              - beta
          - name: CommitMessage
            description: Enter the version and build number (ex. 1.5.5 (255))
      - step:
          script:
            - BB_REPO_PATH=$BITBUCKET_CLONE_DIR
            - GH_REPO_PATH=$BITBUCKET_CLONE_DIR/../nicegram-ios-github
            
            - git clone --depth 1 -b $TargetBranch git@github.com:nicegram/Nicegram-iOS.git $GH_REPO_PATH
            
            - cd $GH_REPO_PATH
            - git rm -rf .
            - git clean -fxd
            
            - cd $BB_REPO_PATH
            - git submodule update --recursive --init
            - cp -r .git/modules/. $GH_REPO_PATH/.git/modules
            - rm -rf .git
            - cp -r . $GH_REPO_PATH
            
            - cd $GH_REPO_PATH
            # Fork-internal tooling and process docs stay out of the public mirror.
            # docs/changes is in this set too: change records describe gating,
            # remote-config keys and unreleased behaviour. So is docs/crashes:
            # the crash registry states crash volumes, affected-user counts and
            # our written judgement that specific upstream Telegram bugs are
            # abandoned. Safe to delete here
            # (unlike packages/, which Package.swift and MODULE.bazel require
            # present): nothing in the build reads any of these paths.
            - rm -rf .claude docs/superpowers docs/tg-merge docs/changes docs/crashes
            # Assert the private package is recorded as a gitlink, never as
            # files. The mirror must keep packages/ as a submodule reference —
            # Package.swift and MODULE.bazel require it present for the release
            # build (.github/workflows/beta.yml, master.yml) to resolve at all.
            - git add .
            - |
              n=$(git ls-files --stage -- packages | wc -l | tr -d ' ')
              bad=$(git ls-files --stage -- packages | awk '$1 != "160000"')
              if [ "$n" -lt 1 ] || [ -n "$bad" ]; then
                echo "ERROR: packages/ has an entry that is not a gitlink ($n entries staged; non-160000 rows: $bad)"; exit 1
              fi
            - |
              if git diff --cached --name-only --diff-filter=d | grep -qE '^(\.claude|docs/superpowers|docs/tg-merge|docs/changes|docs/crashes)/'; then
                echo "ERROR: fork-internal docs staged for the public mirror"; exit 1
              fi
            - git config user.email "denis.shilovichhh@gmail.com"
            - git config user.name "Denis Shilovich"
            - git commit --allow-empty -m "$CommitMessage"
            - git push origin $TargetBranch
